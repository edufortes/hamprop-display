name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (leave empty for a build-only run)"
        required: false
        default: ""

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install tools
        run: pip install platformio esptool==5.1.0 pyyaml littlefs-python fatfs-ng intelhex

      - name: Build and merge image
        run: |
          scripts/merge-firmware.sh "release/hamprop-${TAG}.bin"
          cd release && sha256sum "hamprop-${TAG}.bin" > "hamprop-${TAG}.bin.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: hamprop-firmware
          path: release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## What's included"
            echo
            git log --no-merges --pretty='- %s' "${PREV:+$PREV..}$TAG"
            if [ -n "$PREV" ]; then
              echo
              echo "Full changes since $PREV: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
            echo
            echo "## Flashing"
            echo
            echo "Flash \`hamprop-${TAG}.bin\` at offset 0x0 with [esptool-js](https://espressif.github.io/esptool-js/) (Chrome or Edge)."
            echo "Then join the \`HamProp-Setup\` Wi-Fi to set up Wi-Fi and your grid locator."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          for attempt in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" &&
                gh release upload "$TAG" release/* --clobber && exit 0
            else
              gh release create "$TAG" release/* --verify-tag \
                --title "HamProp Display $TAG" --notes-file "$RUNNER_TEMP/notes.md" && exit 0
            fi
            echo "attempt $attempt failed, retrying in 15 s"
            sleep 15
          done
          exit 1
